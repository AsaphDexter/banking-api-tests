name: API tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      banking_app_ref:
        description: 'Branch or tag of BasicBankingApplication to test'
        default: 'main'

env:
  BANKING_APP_REPO: AsaphDexter/BasicBankingApplication
  API_URL: http://localhost:8080
  API_URL_SHORT_LOCKOUT: http://localhost:8081
  API_URL_THROTTLED: http://localhost:8082
  ADMIN_TOKEN: ci-admin-token-0123456789

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out these tests
        uses: actions/checkout@v4

      - name: Check out the banking API under test
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BANKING_APP_REPO }}
          ref: ${{ github.event.inputs.banking_app_ref || 'main' }}
          path: banking-app

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: banking-app/pom.xml

      - name: Build the banking API and collect its libraries
        working-directory: banking-app
        run: mvn -B -q -DskipTests compile dependency:copy-dependencies -DincludeScope=runtime

      - name: Start three instances of the banking API (in-memory demo mode)
        run: |
          CP="banking-app/target/classes:banking-app/target/dependency/*"
          # main: normal settings; the per-client login limit is raised so the suite's deliberate failures do not trip it
          nohup java -cp "$CP" basicbankingapp.BankingApiApp --memory --port 8080 \
            --admin-token "$ADMIN_TOKEN" --login-failure-limit 100000 > api-main.log 2>&1 &
          # accounts lock for only 2 seconds, so lock expiry can be tested
          nohup java -cp "$CP" basicbankingapp.BankingApiApp --memory --port 8081 \
            --lockout-seconds 2 --login-failure-limit 100000 > api-short-lockout.log 2>&1 &
          # at most 5 failed logins per client, so throttling can be tested
          nohup java -cp "$CP" basicbankingapp.BankingApiApp --memory --port 8082 \
            --admin-token "$ADMIN_TOKEN" --login-failure-limit 5 > api-throttle.log 2>&1 &
          for port in 8080 8081 8082; do
            for i in $(seq 1 30); do
              if curl -sf "http://localhost:$port/api/health" > /dev/null; then echo "API on $port is up"; break; fi
              sleep 1
              if [ "$i" = "30" ]; then echo "API on $port did not start"; cat api-*.log; exit 1; fi
            done
          done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Type-check the tests
        run: npm run typecheck

      - name: Run the API tests
        run: npx playwright test

      - name: Set up k6
        if: ${{ !cancelled() }}
        uses: grafana/setup-k6-action@v1

      - name: Performance smoke test
        run: k6 run --summary-export=perf-smoke-summary.json perf/smoke.js

      - name: Performance load test
        run: k6 run --summary-export=perf-load-summary.json perf/load.js

      - name: Performance test - does signing in slow everyone else down?
        run: k6 run --summary-export=perf-isolation-summary.json perf/login-isolation.js

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            playwright-report/
            test-results/
            perf-*-summary.json
            api-*.log
          if-no-files-found: ignore
